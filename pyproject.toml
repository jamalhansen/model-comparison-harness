[project]
name = "model-comparison-harness"
version = "0.1.0"
description = "Backtest a candidate model against content-discovery-agent's real Claude-scored history to answer: is local good enough here?"
requires-python = ">=3.12"
dependencies = [
    "content-discovery-agent",
    "local-first-common",
    "typer>=0.15.0",
]

[project.scripts]
model-comparison-harness = "model_comparison_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_comparison_harness"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }
content-discovery-agent = { path = "../content-discovery-agent" }

[tool.pytest.ini_options]
pythonpath = ["src"]
